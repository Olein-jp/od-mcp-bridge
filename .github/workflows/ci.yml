name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: WordPress 6.9 / PHP 7.4
            core: WordPress/WordPress#6.9
            php: '7.4'
          - name: WordPress 6.9 / PHP 8.2
            core: WordPress/WordPress#6.9
            php: '8.2'
          - name: Latest WordPress / PHP 8.2
            core: ''
            php: '8.2'
          - name: Latest WordPress / PHP 8.4
            core: ''
            php: '8.4'
    env:
      WP_ENV_CORE: ${{ matrix.core }}
      WP_ENV_PHP_VERSION: ${{ matrix.php }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install npm dependencies
        run: npm ci

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Start wp-env
        run: npm run env:start

      - name: Run WordPress integration tests
        run: composer test:integration

      - name: Run PHPCS
        run: composer lint

      - name: Stop wp-env
        if: always()
        run: npm run env:stop
